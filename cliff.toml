[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}
{% endfor %}

{% endfor %}
"""

footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}

<!-- generated by git-cliff -->
"""

trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = true
split_commits = false

commit_parsers = [
    # User-facing changes
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },

    # Existing behaviour that changed/improved
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^improvement", group = "Changed" },

    # Internal-only commits
    { message = "^chore", skip = true },
    { message = "^docs", skip = true },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
]

protect_breaking_commits = true

filter_commits = true
fail_on_unmatched_commit = true

tag_pattern = "v[0-9].*"

topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true

# Additional commit types that count as patch-level releases.
custom_patch_increment_regex = "^(fix|perf|refactor|improvement)(\\([^)]*\\))?:"